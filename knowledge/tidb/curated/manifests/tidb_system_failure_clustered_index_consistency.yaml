hops:
  - hop_id: H1
    knowledge_question: What relationship connects the ODKU error to the target index evidence?
    expected_concept: A mutable clustered primary-key handle and a participating secondary index make the ODKU path a row-handle/index-maintenance problem, not a query-cache problem.
    version_scope: TiDB v6.5.0 clustered-index and ODKU behavior
    required_environment_binding: target SHOW CREATE TABLE, index catalog, actual ODKU, 8141/8134 and primary/secondary reads
    decision_changed: root-cause and affected-object selection
    counterfactual: healthy nonclustered primary-key or no-ODKU neighbor is treated as the same fault
    allowed_source_scope: [self_managed]
    visible_evidence: schema DDL, index definitions, write statements, consistency output, forced access paths, and logs
  - hop_id: H2
    knowledge_question: Why can an ON UPDATE timestamp change the physical handle during duplicate update?
    expected_concept: An ON UPDATE timestamp participating in the clustered primary key can change the row handle even when the duplicate-update list omits that column.
    version_scope: TiDB v6.5.0 timestamp and clustered-handle semantics
    required_environment_binding: actual old/new state_ts values, account identity, duplicate-update SQL, and repeated write result
    decision_changed: whether a handle transition must be included in the diagnosis
    counterfactual: ordinary UPDATE or immutable clustered key is assumed equivalent
    allowed_source_scope: [self_managed]
    visible_evidence: SHOW CREATE TABLE, canary history, current handle reads, and ledger event rows
  - hop_id: H3
    knowledge_question: What does tidb_txn_assertion_level cover and what does it not repair?
    expected_concept: OFF/FAST/STRICT and global/session scope must be checked on every live endpoint; STRICT protects future writes or exposes conflicts but cannot repair historical rows.
    version_scope: TiDB v6.5.0-v7.5.0 transaction assertion variables
    required_environment_binding: every TiDB endpoint, fresh session, global value, session value, and connection-pool behavior
    decision_changed: future-write guard and verification scope
    counterfactual: changing one global value or only one session is treated as complete recovery
    allowed_source_scope: [self_managed]
    visible_evidence: global/session variable queries through each endpoint and fresh connections
  - hop_id: H4
    knowledge_question: Which release boundary and transaction paths matter for recovery?
    expected_concept: The vulnerable/fixed release matrix must cover PD, TiKV, and TiDB, and both autocommit and explicit-transaction ODKU canaries must be repeated after upgrade.
    version_scope: TiDB v6.5.0 vulnerable and v7.5.0 fixed release boundary
    required_environment_binding: all component versions, upgrade results, endpoint readiness, autocommit path, and explicit transaction path
    decision_changed: whether writes may resume and which upgrade scope is complete
    counterfactual: upgrading one TiDB endpoint or checking only a healthy service endpoint is treated as sufficient
    allowed_source_scope: [self_managed]
    visible_evidence: cluster release matrix, component inventory, upgrade acknowledgements, and canary results
  - hop_id: H5
    knowledge_question: What must happen before any upgrade or repair action?
    expected_concept: Stop the target ODKU writer and preserve consistency, primary/secondary, ledger, and schema evidence before upgrade or DDL.
    version_scope: K12 forensic and write-quiescence contract
    required_environment_binding: target writer, forensic snapshots, ledger state, and action ordering
    decision_changed: safe repair start boundary
    counterfactual: fixing the index or upgrading before capturing canonical evidence
    allowed_source_scope: [self_managed]
    visible_evidence: action history, ADMIN CHECK TABLE, forced reads, ledger query, and writer state
  - hop_id: H6
    knowledge_question: How should the repair family be selected?
    expected_concept: Rebuild affected indexes only when clustered records are trusted; otherwise logically reconstruct from the append-only ledger and switch within the target table family.
    version_scope: K12 canonical-truth and repair-family contract
    required_environment_binding: ledger-to-target comparison, row-handle trust, all affected secondary indexes, and protected neighbors
    decision_changed: index rebuild versus logical reconstruction
    counterfactual: assertion-only change or index-only rebuild is treated as historical repair without checking canonical truth
    allowed_source_scope: [self_managed]
    visible_evidence: ledger rows, primary/secondary path comparison, index catalog, and rebuild/reconstruction result
  - hop_id: H7
    knowledge_question: Which actions are inside the safe repair boundary?
    expected_concept: Repair is bounded to the target table family and declared canaries; ledger, healthy neighbors, raw TiKV keys, and unapproved services remain protected.
    version_scope: K12 DP/OP/SP safety contract
    required_environment_binding: SQL targets, action scope, protected-object baselines, and service operations
    decision_changed: whether a proposed mutation is authorized
    counterfactual: unbounded DDL/DML, raw-key mutation, or protected-table change is treated as a valid shortcut
    allowed_source_scope: [self_managed]
    visible_evidence: SQL text, action history, protected snapshots, and service target
  - hop_id: H8
    knowledge_question: What proves that recovery is complete?
    expected_concept: Component versions, endpoint assertion scope, schema contract, official consistency, both forced paths, ledger truth, new canaries, and healthy neighbors must form one closed loop.
    version_scope: TiDB v7.5.0 final acceptance and K12 business contract
    required_environment_binding: final cluster state, all endpoint variables, target schema/data/indexes, ledger, canaries, and healthy controls
    decision_changed: final submit boundary
    counterfactual: one green check, a successful DDL, or a clean endpoint is treated as full recovery
    allowed_source_scope: [self_managed]
    visible_evidence: final SQL/check results, release inventory, canary rows, and protected-state comparison
