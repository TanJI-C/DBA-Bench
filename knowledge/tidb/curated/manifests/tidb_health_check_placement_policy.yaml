hops:
  - hop_id: H1
    knowledge_question: Which review item maps to the current physical object?
    expected_concept: Join the live review to service, table, and partition catalogs; exclude historical and approved rows.
    required_environment_binding: review status, service name, table identity, table policy, partition policies
    allowed_source_scope: [aiopsbench-tidb-hc08:scope#review-binding]
  - hop_id: H2
    knowledge_question: Why can a table reset leave a partition placement exception?
    expected_concept: Explicit partition binding takes precedence over a table binding and survives table DEFAULT reset.
    required_environment_binding: information_schema.tables and information_schema.partitions for the same target
    allowed_source_scope: [aiopsbench-tidb-hc08:inheritance#partition-precedence]
  - hop_id: H3
    knowledge_question: How should policy fields and dictionary constraints be interpreted?
    expected_concept: FOLLOWERS counts followers plus a leader; topology fields use labels; dictionary constraints assign counts.
    required_environment_binding: full placement policy definition and available placement labels
    allowed_source_scope: [aiopsbench-tidb-hc08:policy#field-semantics]
  - hop_id: H4
    knowledge_question: How can an accepted policy be technically unsatisfiable?
    expected_concept: Requested replicas or label domains exceed the current TiKV Store and Region-peer capacity.
    required_environment_binding: Store list, Store labels, Region peers, policy fields, placement state
    allowed_source_scope: [aiopsbench-tidb-hc08:capacity#store-mismatch]
  - hop_id: H5
    knowledge_question: What does a placement scheduling state prove?
    expected_concept: SQL admission and asynchronous scheduling states are not final convergence.
    required_environment_binding: SHOW PLACEMENT plus operator/scheduler observations and a post-action re-read
    allowed_source_scope: [aiopsbench-tidb-hc08:progress#async-state]
  - hop_id: H6
    knowledge_question: What is the smallest safe repair for an inherited-placement review?
    expected_concept: Reset the mapped table and all explicit target partition bindings to DEFAULT; preserve shared state.
    required_environment_binding: current review scope, table/partition bindings, protected neighbors and control-plane state
    allowed_source_scope: [aiopsbench-tidb-hc08:repair#default-scope]
  - hop_id: H7
    knowledge_question: What proves that the routine review is complete?
    expected_concept: Target placement converged, exact review closed, protected state and business truth unchanged.
    required_environment_binding: final table/partition catalog, SHOW PLACEMENT, review row, business CRC
    allowed_source_scope: [aiopsbench-tidb-hc08:acceptance#closed-loop]
