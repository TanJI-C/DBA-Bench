hops:
  - hop_id: H1
    knowledge_question: What does a failed BR checkpoint represent in the current restore version?
    expected_concept: Checkpoint is durable progress for one restore request and is version-scoped, not a standalone backup.
    required_environment_binding: BR and target release, restore phase, checkpoint location, original request identity
    allowed_source_scope: [self_managed]
  - hop_id: H2
    knowledge_question: Which boundaries make the PITR chain reachable?
    expected_concept: A snapshot before the target plus continuous log backup coverage through the requested target is required; global checkpoint is cluster-wide evidence.
    required_environment_binding: snapshot BackupTS, log start and global checkpoint, target TSO, retention, object continuity
    allowed_source_scope: [self_managed]
  - hop_id: H3
    knowledge_question: Which values must remain unchanged on an exact retry?
    expected_concept: Upstream identity, BackupTS, start-ts, restored-ts, target identity, and checkpoint phase must match the original request.
    required_environment_binding: original attempt args, checkpoint metadata, target cluster identity and current object prefix
    allowed_source_scope: [self_managed]
  - hop_id: H4
    knowledge_question: Why is a matching target cluster ID insufficient after a failed restore?
    expected_concept: Target-side table/ID mapping and external writes after checkpoint persistence can make checkpoint ownership ambiguous.
    required_environment_binding: partial target catalog and writes after checkpoint persistence
    allowed_source_scope: [self_managed]
  - hop_id: H5
    knowledge_question: What is the safe action when the partial target is no longer checkpoint-compatible?
    expected_concept: Retire the incompatible attempt explicitly and use a newly isolated target with the same valid chain and requested point, or reject if continuity is not proven.
    required_environment_binding: abandon state, old target identity, new target identity, chain continuity and protected objects
    allowed_source_scope: [self_managed]
  - hop_id: H6
    knowledge_question: What proves recovery rather than process-level success?
    expected_concept: Terminal restore state, target time boundary, business truth, continuous objects, and unchanged source/protected backup state must all hold.
    required_environment_binding: final restore attempt, target markers/checksums, source truth, object inventory and protected neighbors
    allowed_source_scope: [self_managed]
