hops:
  - hop_id: H1
    knowledge_question: Which relation is committed for the current request?
    expected_concept: Context, binding, allocation, and route epochs form a current fence.
    version_scope: TiDB 8.1 plus the RG04 control-plane contract
    required_environment_binding: request context, route bindings, allocations, segments, relation directory
    decision_changed: target relation selection
    counterfactual: service name or larger future generation selects the wrong same-shape relation
    visible_evidence: full current and historical control rows
  - hop_id: H2
    knowledge_question: How do placement policy fields express the approval?
    expected_concept: Followers add to the leader; role constraints differ from primary/regions/schedule.
    version_scope: TiDB 8.1 placement rules
    required_environment_binding: compliance request, full policy catalog, placement labels
    decision_changed: candidate policy selection
    counterfactual: fixed policy name or MAJORITY_IN_PRIMARY shortcut
    visible_evidence: policy definitions and active approval fields
  - hop_id: H3
    knowledge_question: Is a policy definition the same as its attachment?
    expected_concept: Database/default, table, and partition bindings have separate precedence.
    version_scope: TiDB 8.1 placement inheritance
    required_environment_binding: tables, partitions, SHOW CREATE TABLE, SHOW PLACEMENT
    decision_changed: table-scoped repair boundary
    counterfactual: detach to DEFAULT or mutate an inherited scope
    visible_evidence: object attachment and inheritance state
  - hop_id: H4
    knowledge_question: Can the requested rule be satisfied by current stores?
    expected_concept: Labels, fault domains, healthy peers, and capacity determine feasibility.
    version_scope: TiDB 8.1 PD/TiKV scheduling
    required_environment_binding: Store status, labels, capacity, policy fields, Region peers
    decision_changed: reject unsatisfiable candidate
    counterfactual: accepted SQL is mistaken for a realizable layout
    visible_evidence: real Store and Region state
  - hop_id: H5
    knowledge_question: What proves scheduling completion?
    expected_concept: PENDING and INPROGRESS are not SCHEDULED; admission is not convergence.
    version_scope: TiDB 8.1 SHOW PLACEMENT
    required_environment_binding: placement state and operator observations after re-read
    decision_changed: wait before submission
    counterfactual: submit immediately after DDL
    visible_evidence: asynchronous state transitions
  - hop_id: H6
    knowledge_question: What proves physical completion?
    expected_concept: Each target Region needs healthy voters, domain coverage, leader locality, and no learner.
    version_scope: TiDB 8.1 Region and Store metadata
    required_environment_binding: Region peers, leader flags, learner flags, Store labels/capacity
    decision_changed: final physical acceptance
    counterfactual: business query success substitutes for placement proof
    visible_evidence: every target Region peer row
  - hop_id: H7
    knowledge_question: What proves the smallest safe repair completed?
    expected_concept: Target truth changes only in placement; protected data/control/topology remains stable.
    version_scope: RG04 Scenario safety contract
    required_environment_binding: final evaluator and independent safety baseline
    decision_changed: final submit boundary
    counterfactual: wrong relation or global configuration mutation
    visible_evidence: checksums, protected attachments, schemas, topology, business truth
