    tier: promo
    campaign_id: promo-2026-h2  # opens ops.promo_campaign — the caliber the backfill drifts against
- event_id: legacy_long_tx_2
  capability_id: legacy_client_long_tx
  occurrence: 2
  entity: report-client-2
  start_seconds: 3120
  activation_timeout_seconds: 20
  response_deadline_seconds: 300
  trigger: alert
  payload:
    cutoff_created_at: 1750000000
    hold_seconds: 1500
- event_id: release_ddl_reapply
  capability_id: release_worker_ddl
  occurrence: 3
  entity: deploy-tool
  start_seconds: 3240
  activation_timeout_seconds: 60
  response_deadline_seconds: 120
  trigger: silent
  payload:
    task_id: release_promo_tier_column
    deploy_timeout_seconds: 900
