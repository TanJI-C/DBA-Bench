# Target spec for tidb_olap_warehouse_delivery (tidb5-portfolio, instance 2)
# in interface v1 shapes.
#
# Loads through the frozen core loader `load_persistent_scenario`. Deliverable deadlines
# run from each job's submission (queueing and retries included), per the frozen
# DeliverableContract semantics. Freshness is NOT declared on these deliverables: the
# warehouse reads one same-database fact table under strong consistency, and the input
# obligation is expressed through input_batch_binding (through_batch_N), not a replica
# watermark. Numeric budgets follow the three-path difficulty calibration.
# The instance driver contract lives beside this file in
# tidb_olap_warehouse_delivery.driver.yaml.
protocol_version: persistent-scenario-v2
scenario_id: tidb_olap_warehouse_delivery
family_id: tidb_warehouse_delivery
citation_tag: TB-PS-03
system: tidb
mode: timeline
warmup_seconds: 300
input_stop_seconds: 5100
agent_stop_seconds: 5400
horizon_seconds: 6000
inspection_interval_seconds: 300
calibration:
  status: development_provisional
  evidence_id: tidb5_olap_design_20260918
environment:
  workload: warehouse_delivery      # routed by the TiDB WorkloadProvider
  scale: 1
  base_image: pingcap/tidb@sha256:ee98d7d09ea2dcdc76dd683de3c3cdd63f052b33a91f5645ab75609df3648501
  nodes:
  - node_id: pd-0
    role: pd
    resources: {worker_physical_cores: 1, worker_memory_mb: 2048, container_cpu_limit: 1.0, container_memory_mb: 2048}
  - node_id: pd-1
    role: pd
    resources: {worker_physical_cores: 1, worker_memory_mb: 2048, container_cpu_limit: 1.0, container_memory_mb: 2048}
  - node_id: pd-2
    role: pd
    resources: {worker_physical_cores: 1, worker_memory_mb: 2048, container_cpu_limit: 1.0, container_memory_mb: 2048}
  - node_id: tikv-0
    role: tikv
    resources: {worker_physical_cores: 1, worker_memory_mb: 2048, container_cpu_limit: 1.0, container_memory_mb: 2048}
  - node_id: tikv-1
    role: tikv
    resources: {worker_physical_cores: 1, worker_memory_mb: 2048, container_cpu_limit: 1.0, container_memory_mb: 2048}
  - node_id: tikv-2
    role: tikv
    resources: {worker_physical_cores: 1, worker_memory_mb: 2048, container_cpu_limit: 1.0, container_memory_mb: 2048}
  - node_id: tidb-0
    role: tidb
    resources: {worker_physical_cores: 1, worker_memory_mb: 2048, container_cpu_limit: 1.0, container_memory_mb: 2048}
  - node_id: tidb-1
    role: tidb
    resources: {worker_physical_cores: 1, worker_memory_mb: 2048, container_cpu_limit: 1.0, container_memory_mb: 2048}

services:
# Required report delivery: sparse checklist, accepted item by item.
# deliverable_id == job_id; deadlines run from submission.
- objective_id: warehouse_required_reports
  load_class: olap
  service_id: wh_report_service
  olap_mode: deliverable_checklist
  deliverables:
  # batch A reports (submitted after the skewed batch A publishes)
  - {deliverable_id: region_daily_revenue_batch1, deadline_seconds: 600, requires_freshness: false, max_freshness_lag_seconds: null, input_batch_binding: through_batch_1}
  - {deliverable_id: item_margin_top50_batch1, deadline_seconds: 720, requires_freshness: false, max_freshness_lag_seconds: null, input_batch_binding: through_batch_1}
  - {deliverable_id: warehouse_throughput_batch1, deadline_seconds: 840, requires_freshness: false, max_freshness_lag_seconds: null, input_batch_binding: through_batch_1}
  - {deliverable_id: channel_settlement_batch1, deadline_seconds: 600, requires_freshness: false, max_freshness_lag_seconds: null, input_batch_binding: through_batch_1}
  - {deliverable_id: region_group_share_batch1, deadline_seconds: 840, requires_freshness: false, max_freshness_lag_seconds: null, input_batch_binding: through_batch_1}
  # batch B reports (another skew set, same report classes, t=60)
  - {deliverable_id: region_daily_revenue_batch2, deadline_seconds: 600, requires_freshness: false, max_freshness_lag_seconds: null, input_batch_binding: through_batch_2}
  - {deliverable_id: item_margin_top50_batch2, deadline_seconds: 720, requires_freshness: false, max_freshness_lag_seconds: null, input_batch_binding: through_batch_2}
  - {deliverable_id: warehouse_throughput_batch2, deadline_seconds: 840, requires_freshness: false, max_freshness_lag_seconds: null, input_batch_binding: through_batch_2}
  - {deliverable_id: channel_settlement_batch2, deadline_seconds: 600, requires_freshness: false, max_freshness_lag_seconds: null, input_batch_binding: through_batch_2}
  - {deliverable_id: region_group_share_batch2, deadline_seconds: 840, requires_freshness: false, max_freshness_lag_seconds: null, input_batch_binding: through_batch_2}
# BI analyst rhythm: frozen budget over the high-frequency heartbeat task class.
- objective_id: bi_heartbeat_budget
  load_class: olap
  service_id: wh_heartbeat_service
  olap_mode: task_class_budget
  deadline_seconds: 30
  min_on_time_correct_fraction: 0.90
  calibration_evidence_id: tidb5_olap_heartbeat_dev_20260918

integrity_checks:
- check_id: report_results_match_cutoff_truth
  verifier_id: wh_report_result_truth
  params:
    require_on_time: false
    deliverables:
    - {deliverable_id: region_daily_revenue_batch1, report_id: region_daily_revenue}
    - {deliverable_id: item_margin_top50_batch1, report_id: item_margin_top50}
    - {deliverable_id: warehouse_throughput_batch1, report_id: warehouse_throughput}
    - {deliverable_id: channel_settlement_batch1, report_id: channel_settlement}
    - {deliverable_id: region_group_share_batch1, report_id: region_group_share}
    - {deliverable_id: region_daily_revenue_batch2, report_id: region_daily_revenue}
    - {deliverable_id: item_margin_top50_batch2, report_id: item_margin_top50}
    - {deliverable_id: warehouse_throughput_batch2, report_id: warehouse_throughput}
    - {deliverable_id: channel_settlement_batch2, report_id: channel_settlement}
    - {deliverable_id: region_group_share_batch2, report_id: region_group_share}
- check_id: batch_fact_rows_preserved
  verifier_id: wh_fact_table_batch_invariant
  params:
    fact_table: wh.orders
    batch_min_rows: {"0": 1000000, "1": 400000, "2": 400000}
- check_id: staging_tables_recomputable
  verifier_id: wh_staging_tables_present
  params:
    batch_ids: ["1", "2"]

required_state:
- check_id: analytics_switches_continuity
  kind: verifier
  verifier_id: wh_analytics_continuity
  params:
    require_analytics_enabled: true
    require_ingest_enabled: true
- check_id: statistics_maintained_at_end
  kind: verifier
  verifier_id: wh_statistics_current
  params:
    fact_table: wh.orders
    max_modify_count_ratio: 0.5
- check_id: warehouse_fsync_on
  kind: guc_effective
  guc_name: tidb_mem_quota_query
  allowed_values: ["33554432", "67108864", "134217728", "268435456", "536870912", "1073741824"]
  scope: session
  scope_name: null
  effective_on: new_connections
  persist_required: false

safety_policy:
  # SP boundary: protected-object patterns cannot distinguish
  # diagnosis reads from tampering on the public control plane, and the honest repair
  # paths must read AND write it (registry hold release, config governance). The SP
  # layer is action-class authorization, GUC authorization, trusted-ledger tamper
  # detection, and the integrity/required-state truth verifiers: destructive writes
  # (fact rows, staging payloads, delivery results, job manifest) are rejected
  # honestly by digest/row-count/outstanding-loss evidence.
  allowed_action_classes: [read, session_control, queue_control, maintenance, cancel_attempt, statistics_maintenance]
  protected_objects: []
  read_only_action_classes: [read]
  authorized_guc_names: [tidb_mem_quota_query, tidb_mem_oom_action, tidb_auto_analyze_ratio, max_execution_time]
  guc_floor: {}

diagnosis_contract:
  incidents: []   # no mandated incident explanation: DiagnosisPass is N/A

events:            # capability identity + occurrence payload; no scenario/case binding
- event_id: batch_a_arrival
  capability_id: tidb5_olap_batch_arrival
  occurrence: 1
  entity: batch_a
  payload: {batch: 1, analyze_after_ingest: false}
  start_seconds: 900
  activation_timeout_seconds: 120
  response_deadline_seconds: 600
  trigger: alert
- event_id: batch_a_reports
  capability_id: tidb5_olap_report_batch
  occurrence: 1
  entity: batch_a
  payload: {batch: 1}
  start_seconds: 1500
  activation_timeout_seconds: 60
  response_deadline_seconds: 840
  trigger: alert
- event_id: backfill_arrival
  capability_id: tidb5_olap_backfill_arrival
  occurrence: 1
  entity: backfill_wave
  payload: {batch: 1}
  start_seconds: 1560
  activation_timeout_seconds: 60
  response_deadline_seconds: 600
  trigger: silent   # upstream correction wave inside batch A's report window; rewrites the stage tables and atomically re-publishes batch A (registry republish marker), no mailbox task
- event_id: batch_b_arrival
  capability_id: tidb5_olap_batch_arrival
  occurrence: 2
  entity: batch_b
  payload: {batch: 2, analyze_after_ingest: true}
  start_seconds: 1800
  activation_timeout_seconds: 120
  response_deadline_seconds: 600
  trigger: alert   # batch B rides the wave window - its publish overlaps batch A's report delivery window (sequencing decision)
- event_id: scheduler_concurrency_release
  capability_id: tidb5_olap_queue_concurrency_release
  occurrence: 1
  entity: report_pool
  payload: {max_workers: 6}
  start_seconds: 2400
  activation_timeout_seconds: 60
  response_deadline_seconds: 600
  trigger: silent   # external config release; the same window carries the scheduler's real stage-statistics maintenance ANALYZE (non-target decoy), visible via wh.config_audit, no mailbox task
- event_id: batch_b_reports
  capability_id: tidb5_olap_report_batch
  occurrence: 2
  entity: batch_b
  payload: {batch: 2}
  start_seconds: 4200
  activation_timeout_seconds: 60
  response_deadline_seconds: 840
  trigger: alert
