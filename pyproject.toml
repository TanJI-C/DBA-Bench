[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiopsbench"
version = "0.1.0"
description = "数据库运维Agent Benchmark框架"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9",
    "pymysql>=1.1.0",
    "pyyaml>=6.0",
    "sqlglot>=26,<28",
    "openai>=1.0.0",
    "anthropic>=0.34.0",
    "tiktoken>=0.5",
    "transformers>=4.40",
    "numpy>=1.24",
    "statsmodels>=0.14",
    "typing-extensions>=4.6",
    "pytest>=7.0.0",
]

[project.scripts]
aiopsbench = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
data = [
    "dvc>=3.60.0",
]
knowledge = [
    "chromadb>=0.5.0",
    "llama-index-core>=0.10.0",
    "llama-index-embeddings-huggingface>=0.2.0",
    "llama-index-vector-stores-chroma>=0.1.0",
    "sentence-transformers>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.setuptools.package-data]
"src.persistent_scenarios" = ["postgres/*.yaml"]
